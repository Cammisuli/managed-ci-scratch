# Step environment demo: Nx Cloud names first, GitHub names kept as aliases.
triggers:
  main-pushes:
    event: PUSH
    branches:
      - main

workflows:
  main:
    runs-on: linux-medium-js
    steps:
      - name: Export env and PATH for later steps
        script: |
          echo "GREETING=hello from an earlier step" >> $GITHUB_ENV
          mkdir -p $NX_CLOUD_RUNNER_TEMP/bin
          printf '#!/bin/sh\necho "my-tool: found on PATH added by an earlier step"\n' > $NX_CLOUD_RUNNER_TEMP/bin/my-tool
          chmod +x $NX_CLOUD_RUNNER_TEMP/bin/my-tool
          echo "$NX_CLOUD_RUNNER_TEMP/bin" >> $NX_CLOUD_PATH

      - name: Read env and PATH
        script: |
          echo "GREETING=$GREETING"
          my-tool

      - group-name: Compute in parallel
        parallel: true
        steps:
          - name: Compute version
            id: version
            script: echo "value=1.2.3" >> $NX_CLOUD_OUTPUT
          - name: Compute artifact name (GitHub alias)
            id: artifact
            script: echo "name=app-linux-x64.tgz" >> $GITHUB_OUTPUT

      - name: Use step outputs
        script: |
          echo "version  = ${{ steps.version.outputs.value }}"
          echo "artifact = ${{ steps.artifact.outputs.name }}"

      - name: Greeter template
        uses: Cammisuli/managed-ci-scratch/main/.nx/steps/demo/main.yaml
        inputs:
          greeting: hi

      - name: Run context
        script: |
          echo "sha        = $NX_CLOUD_SHA"
          echo "ref        = $NX_CLOUD_REF (name: $NX_CLOUD_REF_NAME)"
          echo "event      = $NX_CLOUD_EVENT_NAME"
          echo "repository = $NX_CLOUD_REPOSITORY"
          echo "checkout   = $NX_CLOUD_REPOSITORY_DIR"
          echo "runner     = $NX_CLOUD_RUNNER_OS / $NX_CLOUD_RUNNER_ARCH"
          if [ "$GITHUB_SHA" = "$NX_CLOUD_SHA" ] && [ "$GITHUB_REF" = "$NX_CLOUD_REF" ] && [ "$GITHUB_WORKSPACE" = "$NX_CLOUD_REPOSITORY_DIR" ] && [ "$RUNNER_OS" = "$NX_CLOUD_RUNNER_OS" ]; then
            echo "GitHub aliases (GITHUB_SHA, GITHUB_REF, GITHUB_WORKSPACE, RUNNER_OS) match"
          else
            echo "GitHub aliases differ"
          fi

      - name: Call the VCS API with the run's token
        env:
          NX_CLOUD_VCS_TOKEN: ${{ secrets.NX_CLOUD_VCS_TOKEN }}
        script: |
          status=$(curl -s -o "$NX_CLOUD_RUNNER_TEMP/repo.json" -w '%{http_code}' -H "Authorization: Bearer $NX_CLOUD_VCS_TOKEN" "$NX_CLOUD_VCS_API_URL/repos/$NX_CLOUD_REPOSITORY")
          echo "GET $NX_CLOUD_VCS_API_URL/repos/$NX_CLOUD_REPOSITORY -> $status"
          node -e 'const r = require(process.argv[1]); console.log(`full_name=${r.full_name} default_branch=${r.default_branch}`)' "$NX_CLOUD_RUNNER_TEMP/repo.json"
