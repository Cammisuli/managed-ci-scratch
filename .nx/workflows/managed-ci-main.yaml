# verify 23
triggers:
  main-pushes:
    event: PUSH
    branches:
      - main

workflows:
  main:
    runs-on: linux-medium-js
    steps:
      - name: setenv
        script: |
          echo PLAIN=plain-value >> $GITHUB_ENV
          printf 'MULTI<<EOF\nline-one\nline-two\nEOF\n' >> $GITHUB_ENV
          mkdir -p $RUNNER_TEMP/bin
          printf '#!/bin/sh\necho from-path-bin\n' > $RUNNER_TEMP/bin/hello
          chmod +x $RUNNER_TEMP/bin/hello
          echo $RUNNER_TEMP/bin >> $GITHUB_PATH
      - name: readenv
        script: echo plain=$PLAIN; echo "$MULTI"; hello
      - group-name: par
        parallel: true
        steps:
          - name: p1
            id: p1
            script: echo val=one >> $GITHUB_OUTPUT; echo ::set-output name=legacy::l-one
          - name: p2
            id: p2
            script: echo val=two >> $GITHUB_OUTPUT; echo ::set-output name=legacy::l-two
      - name: readout
        script: echo "out ${{ steps.p1.outputs.val }}/${{ steps.p1.outputs.legacy }} ${{ steps.p2.outputs.val }}/${{ steps.p2.outputs.legacy }}"
      - name: st
        uses: Cammisuli/managed-ci-scratch/main/.nx/steps/st/main.yaml
        inputs:
          label: hi
      - name: envlist
        script: env | grep -e '^GITHUB_SHA=' -e '^GITHUB_REF=' -e '^GITHUB_EVENT_NAME=' -e '^RUNNER_OS='; echo gha=$(env | grep -c '^GITHUB_ACTIONS=') tok=$(env | grep -c -e '^GITHUB_TOKEN=' -e '^GH_TOKEN=')
      - name: control
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        script: echo ctl=$(env | grep -c -e '^GH_TOKEN=')
      - name: api
        script: curl -s -o /dev/null -w 'api=%{http_code}\n' -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
  checks:
    runs-on: linux-medium-js
    steps:
      - name: Show projects
        script: npx nx show projects
