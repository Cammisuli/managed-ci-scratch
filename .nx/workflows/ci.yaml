name: MJW verify
on:
  pushes:
    event: PUSH
    branches: ['v392/**']
launch-templates: .nx/workflows/agents.yaml
jobs:
  main:
    runs-on: local-small
    workers:
      small: 1 local-small
      medium: 2 local-small
      large: 3 local-small
      main-job-worker: {cpu: 2, memory: 4GB}
      assignment-rules:
        - targets: ['mjw-*']
          run-on:
            - agent: main
    steps:
      - name: all-targets
        run: npx nx run-many -t mjw-first mjw-nested mjw-last plain
      - name: mjw-first
        run: npx nx run-many -t mjw-first
      - name: mjw-nested
        run: npx nx run-many -t mjw-nested
      - name: last
        run: pgrep -af 'start-worker --background' && npx nx run-many -t mjw-last
