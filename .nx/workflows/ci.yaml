name: Worker sizing demo
on:
  verify-wake:
    event: PUSH
    branches: [verify-wake]
launch-templates: .nx/workflows/agents.yaml
jobs:
  main:
    runs-on: local-small
    workers:
      small: 1 local-small
      medium: 2 local-small
      large: 3 local-small
    steps:
      - name: Hold before Nx
        run: sleep 60
      - name: Build core
        run: npx nx run-many -t build -p core
      - name: Build and test everything
        run: npx nx run-many -t build test
