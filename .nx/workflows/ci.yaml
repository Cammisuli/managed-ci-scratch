triggers:
  main-pushes:
    event: PUSH
    branches: [main]
  pull-requests:
    event: PR

workflows:
  main:
    runs-on: linux-medium-js
    distribute: true
    steps:
      - name: Affected build
        script: npx nx affected -t build test
  versions:
    runs-on: local-small
    steps:
      - name: Record node version
        script: echo "node is $(node --version)"
