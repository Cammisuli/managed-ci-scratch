name: D2
on:
  pushes:
    event: PUSH
    branches: [verify42-d2]
launch-templates:
  lt-sec:
    resource-class: 'docker_linux_amd64/small'
    image: 'docker.io/library/managed-ci-demo-node:20-bookworm'
    env:
      HOME: /tmp
      LT_TOKEN: ${{ secrets.NPM_TOKEN }}
    init-steps:
      - name: Checkout
        uses: 'nrwl/nx-cloud-workflows/v5/workflow-steps/checkout/main.yaml'
      - name: probe
        script: |
          echo "w tok=$NPM_TOKEN len=${#NPM_TOKEN} lt=$LT_TOKEN ltlen=${#LT_TOKEN} fn=$FN sha=$SHA"
jobs:
  main:
    runs-on: lt-sec
    workers: 1 lt-sec
    steps:
      - run: |
          echo "unmapped len=${#NPM_TOKEN} nv=[$NODE_VERSION]"
      - run: |
          echo "mapped=$NPM_TOKEN len=${#NPM_TOKEN}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: |
          echo "vars=${{ vars.NODE_VERSION }} sec=[${{ secrets.NODE_VERSION }}]"
