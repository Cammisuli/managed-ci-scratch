name: Worker sizing demo
on:
  pull-requests:
    event: PR
    branches: [demo-base]
launch-templates: .nx/workflows/agents.yaml
jobs:
  main:
    runs-on: local-small
    workers:
      small: 1 local-small
      medium: 2 local-small
      large: 3 local-small
    steps:
      - name: Warm up
        run: |
          echo "Starting on the small size: 1 worker. Nx Cloud sizes the workers when the Nx command starts."
          sleep 30
      - name: Build and test
        run: npx nx run-many -t build test
