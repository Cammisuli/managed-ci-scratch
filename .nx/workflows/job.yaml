name: v393 verify
on:
  pushes:
    event: PUSH
    branches: ['v393/**']
launch-templates: .nx/workflows/agents.yaml
jobs:
  main:
    runs-on: local-small
    env:
      NX_VERBOSE_LOGGING: 'true'
    workers: {small: {count: 1, workload: 0%}, medium: 4, large: 6}
    steps:
      - name: sz
        env:
          NX_VERBOSE_LOGGING: 'true'
        run: echo "NX_VERBOSE_LOGGING=$NX_VERBOSE_LOGGING" && npx nx run-many -t sz-work
