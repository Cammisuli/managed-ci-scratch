name: v393 verify
on:
  pushes:
    event: PUSH
    branches: ['v393/**']
launch-templates: .nx/workflows/agents.yaml
jobs:
  main:
    runs-on: local-small
    env:
      NX_VERBOSE_LOGGING: 'true'
    workers: {small: 1, medium: 4, large: 6}
    steps:
      - name: sz
        run: npx nx run-many -t sz-work
