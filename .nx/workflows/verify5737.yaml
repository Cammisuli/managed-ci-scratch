on: {push: {event: PUSH, branches: ['verify5737-canonical']}}
ultracache:
  ignore-reads: ['verify-canonical/**']
jobs:
  main:
    runs-on: linux-medium-js
    workers: 1
    env:
      NX_VERBOSE_LOGGING: "true"
    steps:
      - name: Show canonical ultracache config
        run: |
          echo "host=$(hostname) NX_RUN_GROUP=$NX_RUN_GROUP USE_ULTRACACHE=$NX_CLOUD_USE_ULTRACACHE MODE=$NX_CLOUD_SANDBOXING_ENFORCEMENT_MODE"
          echo "MAIN_CANONICAL_UC=$(cat /tmp/nx-cloud/$NX_RUN_GROUP/ultracache-config.json)"
          ls -la /tmp/nx-cloud/$NX_RUN_GROUP/
      - name: Build
        run: npx nx run-many -t build
