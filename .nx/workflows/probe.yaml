triggers:
  probe-trigger:
    event: PUSH
    branches: [main]

workflows:
  admin:
    runs-on: local-small
    permissions: { repository-contents: admin }
    steps:
      - name: Tag and push
        script: |
          t=admin-$(git rev-parse --short HEAD)
          echo "TAG=$t"
          git tag $t && git push origin $t
