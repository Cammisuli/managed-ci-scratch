triggers:
  probe-trigger:
    event: PR
    branches: [main]

workflows:
  pr:
    runs-on: local-small
    permissions: { repository-contents: write }
    steps:
      - name: Tag and push
        script: |
          t=pr-$(git rev-parse --short HEAD)
          echo "TAG=$t"
          git tag $t && git push origin $t
