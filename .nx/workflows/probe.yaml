triggers:
  probe-trigger:
    event: PUSH
    branches: [main]

workflows:
  readperm:
    runs-on: local-small
    permissions: { repository-contents: read }
    steps:
      - name: Tag and push
        script: |
          t=readperm-$(git rev-parse --short HEAD)
          echo "TAG=$t"
          git tag $t && git push origin $t
