triggers:
  probe-trigger:
    event: PUSH
    branches: [main]

workflows:
  idtok:
    runs-on: local-small
    permissions: { id-token: write }
    steps:
      - name: Tag and push
        script: |
          t=idtok-$(git rev-parse --short HEAD)
          echo "TAG=$t"
          git tag $t && git push origin $t
