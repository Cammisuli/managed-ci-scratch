# GitHub Actions keys in an Nx Cloud workflow:
# name, on, env, defaults, jobs, runs-on, run, working-directory, shell, uses/with, if, timeout-minutes.
name: CI

on:
  main-pushes:
    event: PUSH
    branches:
      - main
  pull-requests:
    event: PR

env:
  GREETING: hello from the workflow env

defaults:
  run:
    working-directory: sub

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    env:
      AUDIENCE: hello from the job env
      COMMIT: ${{ github.sha }}
    steps:
      - name: "working-directory: . (overrides defaults.run)"
        working-directory: .
        run: |
          mkdir -p sub
          echo "ran in: $(basename "$PWD") (the repo root)"
      - name: "defaults.run.working-directory: sub"
        run: |
          echo "ran in: $(basename "$PWD")"
      - name: Workflow, job and step env
        env:
          STEP_VAR: hello from the step env
        run: |
          echo "workflow env  GREETING=$GREETING"
          echo "job env       AUDIENCE=$AUDIENCE"
          echo "step env      STEP_VAR=$STEP_VAR"
          echo "job env with an expression  COMMIT=$COMMIT"
      - name: "shell: sh"
        shell: sh
        run: echo "sh ran the script $0"
      - name: "shell: python"
        shell: python
        run: |
          import sys
          print("python", sys.version.split()[0], "ran this step")
      - name: "uses: + with:"
        uses: Cammisuli/managed-ci-scratch/main/.nx/steps/demo/main.yaml
        with:
          greeting: hi
          target: Nx Cloud

  skipped:
    name: Skipped by job if
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release'
    steps:
      - name: never runs
        run: echo "this line is never printed"

  timeout:
    name: Finishes inside timeout-minutes
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: "sleep 5 (limit: 1 minute)"
        run: |
          sleep 5
          echo "done in 5s, inside the 1 minute limit"
